name: Scraper coches.net

on:
  schedule:
    # UTC — 08:30 y 20:30 hora de Madrid en verano (07:30/19:30 en invierno)
    - cron: "30 6 * * *"
    - cron: "30 18 * * *"
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar scraper
        run: python scraper.py

      - name: Volcar resumen al job summary
        if: always()
        run: cat resumen.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Guardar estado (commit)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .data resumen.md docs
          git diff --cached --quiet && echo "Sin cambios que commitear" && exit 0
          git commit -m "scraper: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main || true
          git push

  publicar:
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Habilitar Pages (idempotente; falla silenciosamente si el repo es privado)
        continue-on-error: true
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}'

      - id: paginas
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
        continue-on-error: true

      - id: despliegue
        uses: actions/deploy-pages@v4
        continue-on-error: true
