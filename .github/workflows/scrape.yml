name: Scraper coches.net

on:
  schedule:
    # UTC — 08:30 y 20:30 hora de Madrid en verano (07:30/19:30 en invierno)
    - cron: "30 6 * * *"
    - cron: "30 18 * * *"
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Diagnóstico de conectividad
        run: |
          echo "== IP de salida =="
          curl -s https://api.ipify.org || true
          echo
          echo "== robots.txt =="
          curl -s -o /tmp/r.txt -w "HTTP %{http_code} · %{size_download} bytes\n" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" https://www.coches.net/robots.txt || true
          head -c 200 /tmp/r.txt || true
          echo
          echo "== listado con curl (grep INITIAL_PROPS) =="
          curl -s -o /tmp/c.html -w "HTTP %{http_code} · %{size_download} bytes\n" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" -H "Accept-Language: es-ES,es;q=0.9" "https://www.coches.net/toyota/corolla/familiar/segunda-mano/" || true
          grep -c "__INITIAL_PROPS__" /tmp/c.html || echo "INITIAL_PROPS NO presente"
          head -c 300 /tmp/c.html || true
          echo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar scraper
        run: python scraper.py

      - name: Volcar resumen al job summary
        if: always()
        run: cat resumen.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Guardar estado (commit)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .data resumen.md
          git diff --cached --quiet && echo "Sin cambios que commitear" && exit 0
          git commit -m "scraper: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
