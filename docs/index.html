  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px 8px}
  .card h3{margin:0 0 8px;font-size:14px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.6px}

  .tbl-card{max-width:1180px;margin:14px auto 30px;padding:0 18px}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;font-size:14px}
  thead th{background:var(--card2);color:var(--tx2);text-align:left;padding:10px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;user-select:none;white-space:nowrap}
  thead th:hover{color:var(--ac)}
  tbody td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
  tbody tr:hover{background:#182138}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  a{color:var(--ac);text-decoration:none}
  a:hover{text-decoration:underline}
  .mini{font-size:12px;color:var(--tx2)}
  .tag{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:0 7px;font-size:12px;color:var(--tx2);margin-left:6px}
  .nuevo{color:var(--ok);font-weight:700} .baja{color:var(--warn);font-weight:700}
  footer{max-width:1180px;margin:0 auto 40px;padding:0 18px;color:var(--tx2);font-size:12px}

const fmtE = n => n==null ? '—' : n.toLocaleString('es-ES') + ' €';
const fmtN = n => n==null ? '—' : n.toLocaleString('es-ES');
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function svgEl(w,h){ return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">`; }

/* ─── KPIs ─── */
function kpis(d){
  const I = d.inventario;
  const precios = I.map(c=>c.precio).sort((a,b)=>a-b);
  const med = precios.length ? precios[Math.floor(precios.length/2)] : null;
  const kmMed = I.length ? Math.round(I.reduce((s,c)=>s+(c.km||0),0)/I.length) : null;
  const hace2 = new Date(Date.now()-2*864e5).toISOString().slice(0,10);
  const recientes = I.filter(c=>c.visto>=hace2).length;
  document.getElementById('kpis').innerHTML = [
    ['a', I.length, 'coches en inventario'],
    ['', d.anuncios, 'anuncios (con multilistings)'],
    ['g', fmtE(precios[0]), 'el más barato'],
    ['a', fmtE(med), 'precio mediano'],
    ['', fmtN(kmMed)+' km', 'km medios'],
    ['g', recientes, 'vistos últimas 48 h'],
    ['w', d.rebajas, 'rebajas en la última tirada'],
  ].map(k=>`<div class="kpi ${k[0]}"><div class="v">${k[1]}</div><div class="l">${k[2]}</div></div>`).join('');
  document.getElementById('sub').innerHTML =
    `Toyota Corolla Touring Sports · <b>${d.config}</b> · ${I.length} coches · actualizado ${esc(d.actualizado)}`;
}

/* ─── 1. histograma precios ─── */
function c1(d){
  const P = d.inventario.map(c=>c.precio).filter(p=>p>0);
  if(!P.length){document.getElementById('c1').innerHTML='<p class=mini>sin datos</p>';return}
  const min=Math.min(...P), max=Math.max(...P), paso=Math.max(1000, Math.round((max-min)/9/500)*500);
  const b0=Math.floor(min/paso)*paso, nb=Math.ceil((max-b0)/paso)+1;
  const bins=new Array(nb).fill(0);
  P.forEach(p=>bins[Math.min(nb-1,Math.floor((p-b0)/paso))]++);
  const W=420,H=200,pad=30,bw=(W-20)/nb,mx=Math.max(...bins);
  let s=svgEl(W,H);
  bins.forEach((n,i)=>{
    const h=(H-pad-10)*(n/mx), x=10+i*bw, y=H-pad-h;
    s+=`<rect x=${x+2} y=${y} width=${bw-4} height=${h} rx=3 fill="#4cc2ff" opacity="${.55+.45*n/mx}"><title>${fmtE(b0+i*paso)} – ${fmtE(b0+(i+1)*paso)}: ${n} coches</title></rect>`;
    if(n)s+=`<text x=${x+bw/2} y=${y-4} fill=#9aa7bd font-size=10 text-anchor=middle>${n}</text>`;
  });
  s+=`<line x1=8 y1=${H-pad} x2=${W-8} y2=${H-pad} stroke=#26304d/>`;
  for(let i=0;i<nb;i+=Math.ceil(nb/6))s+=`<text x=${10+i*bw+bw/2} y=${H-pad+14} fill=#9aa7bd font-size=9 text-anchor=middle>${((b0+i*paso)/1000).toFixed(0)}k</text>`;
  s+='</svg>';
  document.getElementById('c1').innerHTML=s;
}

  const X=km=>px+(W-px-10)*(km/mkm), Y=p=>H-py-12-(H-py-34)*(p/mp);
  let s=svgEl(W,H);
  for(const g of [0,.25,.5,.75,1]){
    s+=`<line x1=${px} y1=${Y(mp*g)} x2=${W-8} y2=${Y(mp*g)} stroke=#1d2740 stroke-dasharray=3 4/>`+
       `<text x=${px-5} y=${Y(mp*g)+3} fill=#9aa7bd font-size=9 text-anchor=end>${Math.round(mp*g/1000)}k</text>`;
    s+=`<line x1=${X(mkm*g)} y1=${H-py-12} x2=${X(mkm*g)} y2=${12} stroke=#1d2740 stroke-dasharray=3 4/>`+
       `<text x=${X(mkm*g)} y=${H-py+2} fill=#9aa7bd font-size=9 text-anchor=middle>${Math.round(mkm*g/1000)}k</text>`;
  }
  I.forEach(c=>{
    s+=`<circle cx=${X(c.km)} cy=${Y(c.precio)} r=5.5 fill="${col(c.anyo)}" stroke=#0b1020 stroke-width=1.5 opacity=.92>`+
       `<title>${esc(c.titulo)}\n${fmtE(c.precio)} · ${fmtN(c.km)} km · ${c.anyo} · ${c.cv} CV\n${esc(c.lugares)}</title></circle>`;
  });
  s+=`<text x=${W-8} y=${12} fill=#9aa7bd font-size=9 text-anchor=end>€ ↑ · km → · color = año (${y0}–${y1})</text></svg>`;
  document.getElementById('c2').innerHTML=s;
}

/* ─── 3. por potencia ─── */
function c3(d){
  const M={};
  d.inventario.forEach(c=>{ (M[c.cv]=M[c.cv]||[]).push(c.precio) });
  const filas=Object.entries(M).map(([cv,ps])=>({cv:+cv,n:ps.length,
    min:Math.min(...ps), med:ps.sort((a,b)=>a-b)[Math.floor(ps.length/2)]})).sort((a,b)=>a.cv-b.cv);
  const W=420,H=filas.length*46+16, mx=Math.max(...filas.map(f=>f.n));
  let s=svgEl(W,H), y=6;
  filas.forEach(f=>{
    const w=(W-150)*(f.n/mx);
    s+=`<text x=0 y=${y+14} fill=#e6edf3 font-size=12>${f.cv} CV</text>`+
       `<rect x=52 y=${y+2} width=${w} height=18 rx=4 fill=#7ee787 opacity=.75><title>${f.n} coches</title></rect>`+
       `<text x=${56+w} y=${y+15} fill=#9aa7bd font-size=11>${f.n}</text>`+
       `<text x=${W-2} y=${y+15} fill=#9aa7bd font-size=10 text-anchor=end>med ${fmtE(f.med)} · mín ${fmtE(f.min)}</text>`;
    y+=46;
  });
  s+='</svg>';
  document.getElementById('c3').innerHTML=s;
}

/* ─── 4. por año ─── */
function c4(d){
  const M={};
  d.inventario.forEach(c=>M[c.anyo]=(M[c.anyo]||0)+1);
  const E=Object.entries(M).sort((a,b)=>a[0]-b[0]);
  const W=420,H=200,pad=30,bw=(W-20)/E.length,mx=Math.max(...E.map(e=>e[1]));
  let s=svgEl(W,H);
  E.forEach(([a,n],i)=>{
    const h=(H-pad-10)*(n/mx),x=10+i*bw;
    s+=`<rect x=${x+3} y=${H-pad-h} width=${bw-6} height=${h} rx=3 fill=#4cc2ff opacity=.8><title>${a}: ${n} coches</title></rect>`+
       `<text x=${x+bw/2} y=${H-pad-h-5} fill=#9aa7bd font-size=10 text-anchor=middle>${n}</text>`+
       `<text x=${x+bw/2} y=${H-pad+14} fill=#9aa7bd font-size=10 text-anchor=middle>${(''+a).slice(2)}</text>`;
  });
  s+=`<line x1=8 y1=${H-pad} x2=${W-8} y2=${H-pad} stroke=#26304d/></svg>`;
  document.getElementById('c4').innerHTML=s;
}

/* ─── 5. nuevos por día ─── */
function c5(d){
  const M={};
  d.inventario.forEach(c=>{ if(c.publicado) M[c.publicado]=(M[c.publicado]||0)+1 });
  const hoy=new Date().toISOString().slice(0,10);
  const dias=[];
  for(let i=20;i>=0;i--){const f=new Date(Date.now()-i*864e5).toISOString().slice(0,10);dias.push([f,M[f]||0])}
  const W=420,H=190,pad=28,bw=(W-20)/dias.length,mx=Math.max(1,...dias.map(x=>x[1]));
  let s=svgEl(W,H);
  dias.forEach(([f,n],i)=>{
    const h=(H-pad-12)*(n/mx),x=10+i*bw;
    s+=`<rect x=${x+2} y=${H-pad-h} width=${bw-4} height=${Math.max(h,n?h:1)} rx=2 fill=${f===hoy?'#7ee787':'#4cc2ff'} opacity=.85><title>${f}: ${n} coches publicados</title></rect>`;
    if(i%5===0)s+=`<text x=${x+bw/2} y=${H-pad+13} fill=#9aa7bd font-size=8.5 text-anchor=middle>${f.slice(5)}</text>`;
  });
  s+=`<line x1=8 y1=${H-pad} x2=${W-8} y2=${H-pad} stroke=#26304d/></svg>`;
  document.getElementById('c5').innerHTML=s;
}

/* ─── 6. precio medio histórico ─── */
function c6(d){
  const Hs=d.historico||[];
  if(Hs.length<2){document.getElementById('c6').innerHTML='<p class=mini>se dibujará a partir de la 2ª tirada 📊</p>';return}
  const W=420,H=190,pad=34;
  const ps=Hs.map(h=>h.precio), mn=Math.min(...ps), mx=Math.max(...ps);
  const X=i=>36+(W-46)*(i/(Hs.length-1)), Y=p=>H-pad+4-(H-pad-16)*((p-mn)/Math.max(1,mx-mn));
  let s=svgEl(W,H);
  s+=`<line x1=${X(0)} y1=${Y(mn)} x2=${X(Hs.length-1)} y2=${Y(mn)} stroke=#1d2740 stroke-dasharray=3 4/>`;
  s+=`<text x=4 y=${Y(mn)+3} fill=#9aa7bd font-size=9>${(mn/1000)|0}k</text><text x=4 y=${Y(mx)+3} fill=#9aa7bd font-size=9>${(mx/1000)|0}k</text>`;
  let path='';
  Hs.forEach((h,i)=>{path+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(h.precio).toFixed(1)+' '});
  s+=`<path d="${path}" fill=none stroke=#ffb86c stroke-width=2.5 stroke-linejoin=round/>`;
  const last=Hs[Hs.length-1];
  s+=`<circle cx=${X(Hs.length-1)} cy=${Y(last.precio)} r=4 fill=#ffb86c><title>${last.fecha}: ${fmtE(last.precio)} (${last.coches} coches)</title></circle>`;
  s+=`<text x=${W-6} y=14 fill=#9aa7bd font-size=9 text-anchor=end>${fmtE(last.precio)} · ${last.coches} coches</text></svg>`;
  document.getElementById('c6').innerHTML=s;
}

/* ─── tabla ─── */
let orden={k:'precio',asc:true};
function tabla(d){
  const tb=document.querySelector('#tbl tbody');
  function paint(){
    const rows=[...d.inventario].sort((a,b)=>{
      const A=a[orden.k],B=b[orden.k];
      return (typeof A=='number'?A-B:(''+A).localeCompare(''+B))*(orden.asc?1:-1);
    });
    tb.innerHTML=rows.map(c=>{
      const extra=c.urls.slice(1).map((u,i)=>` <a href="${u}">·${i+2}ª</a>`).join('');
      const marks=(c.nuevo?'<span class=nuevo>🆕</span> ':'')+(c.rebajado?'<span class=baja>📉</span> ':'')+(c.n>1?`<span class=tag>×${c.n}</span>`:'');
      return `<tr><td class=num><b>${fmtE(c.precio)}</b></td><td class=num>${c.anyo}</td><td class=num>${fmtN(c.km)}</td>`+
        `<td class=num>${c.cv}</td><td><a href="${c.url}">${esc(c.titulo)}</a>${extra} ${marks}<div class=mini>${c.tipo}${c.publicado?' · publicado '+c.publicado:''}</div></td>`+
        `<td>${esc(c.lugares)}</td><td class=mini>${esc(c.vendedor||'—')}</td><td class=mini>${c.visto}</td></tr>`;
    }).join('');
  }
  document.querySelectorAll('#tbl th[data-k]').forEach(th=>{
    th.addEventListener('click',()=>{const k=th.dataset.k;orden=orden.k===k?{k,asc:!orden.asc}:{k,asc:true};paint()});
  });
  paint();
}

if(DATA){
  kpis(DATA);c1(DATA);c2(DATA);c3(DATA);c4(DATA);c5(DATA);c6(DATA);tabla(DATA);
  document.getElementById('foot').innerHTML=
    `Hecho con 💙 por tu scraper (GitHub Actions · 2 tiradas/día) · fuente: coches.net · `+
    `el inventario acumula lo visto en los últimos 14 días · los multilistings se agrupan (×N)`;
}else{
  document.getElementById('sub').textContent='⚠️ sin datos: este fichero se genera automáticamente en cada tirada del scraper';
}
