<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corolla TS Radar 🚗</title>
<style>
  :root{
    --bg:#0b1020; --card:#141b31; --card2:#0f1526; --line:#26304d;
    --tx:#e6edf3; --tx2:#9aa7bd; --ac:#4cc2ff; --ok:#7ee787; --warn:#ffb86c; --bad:#ff7b72;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
  header{padding:22px 18px 10px;max-width:1180px;margin:0 auto}
  h1{margin:0;font-size:26px;letter-spacing:.3px}
  h1 .coche{filter:hue-rotate(140deg)}
  .sub{color:var(--tx2);font-size:13px;margin-top:4px}
  .sub b{color:var(--ac);font-weight:600}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;max-width:1180px;margin:14px auto;padding:0 18px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .kpi .v{font-size:22px;font-weight:700}
  .kpi .l{font-size:12px;color:var(--tx2);margin-top:2px}
  .kpi.a .v{color:var(--ac)} .kpi.g .v{color:var(--ok)} .kpi.w .v{color:var(--warn)}
  .filtros{max-width:1180px;margin:6px auto 4px;padding:10px 18px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
  .filtros .grupo{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .filtros .lab{font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.6px;margin-right:2px}
  .chip{border:1px solid var(--line);border-radius:999px;padding:4px 13px;font-size:13px;color:var(--tx);background:transparent;cursor:pointer;user-select:none}
  .chip:hover{border-color:var(--ac)}
  .chip.on{background:var(--ac);color:#04101e;font-weight:700;border-color:var(--ac)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;max-width:1180px;margin:12px auto;padding:0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px 8px}
  .card h3{margin:0 0 8px;font-size:14px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.6px}
  svg{display:block;width:100%;height:auto}
  .rankwrap{max-width:1180px;margin:12px auto;padding:0 18px}
  .rankcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:10px}
  .rk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;position:relative}
  .rk .pos{font-size:20px;font-weight:800;margin-right:6px}
  .rk .score{position:absolute;top:10px;right:12px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;color:var(--ok)}
  .rk .tit{font-size:14px;font-weight:600;margin:6px 0 2px}
  .rk .spec{font-size:12.5px;color:var(--tx2)}
  .rk .com{font-size:12.5px;margin-top:7px;color:var(--warn);font-style:italic}
  .rk.medalla{border-color:#3c4a75}
  .tbl-card{max-width:1180px;margin:14px auto 30px;padding:0 18px}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;font-size:14px}
  thead th{background:var(--card2);color:var(--tx2);text-align:left;padding:10px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;user-select:none;white-space:nowrap}
  thead th:hover{color:var(--ac)}
  tbody td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
  tbody tr:hover{background:#182138}
  tr.sec td{background:var(--card2);color:var(--ac);font-weight:700;font-size:13px;letter-spacing:.5px;padding:7px 12px}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  a{color:var(--ac);text-decoration:none}
  a:hover{text-decoration:underline}
  .mini{font-size:12px;color:var(--tx2)}
  .tag{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:0 7px;font-size:12px;color:var(--tx2);margin-left:6px}
  .nuevo{color:var(--ok);font-weight:700} .baja{color:var(--warn);font-weight:700}
  .rkn{display:inline-block;background:#1f2c48;border-radius:7px;padding:0 6px;font-size:11.5px;font-weight:700;color:var(--warn);margin-right:5px}
  footer{max-width:1180px;margin:0 auto 40px;padding:0 18px;color:var(--tx2);font-size:12px}
</style>
</head>

<header>
  <h1><span class="coche">🚗</span> Corolla TS <b>Radar</b></h1>

  <div class="card"><h3>Año de matriculación</h3><div id="c4"></div></div>
  <div class="card"><h3>Coches nuevos por día 🆕</h3><div id="c5"></div></div>
  <div class="card"><h3>Precio medio del inventario 📈</h3><div id="c6"></div></div>

<div class="tbl-card card" style="padding:0;overflow-x:auto">

      <th data-k="cv">CV ⇅</th><th>Coche</th><th>Lugar</th><th>Vendedor</th><th data-k="visto">Visto ⇅</th>
    </tr></thead>
    <tbody></tbody>
  </table>
</div>

<footer id="foot"></footer>

/* ─── ranking: IA o heurístico ─── */
function mapaRanking(){
  if (DATA.rankingIA && DATA.rankingIA.ranking){
    const m = {};
    DATA.rankingIA.ranking.forEach((r,i)=>m[r.id]={pos:i+1, score:r.score, com:r.comentario});
    return {m, ia:true, fecha:DATA.rankingIA.fecha, modelo:DATA.rankingIA.ia};
  }
  // heurístico: precio vs regresión km dentro de cada grupo de CV
  const byCv = {};
  DATA.inventario.forEach(c => (byCv[c.cv]=byCv[c.cv]||[]).push(c));
  const m = {};
  Object.values(byCv).forEach(g=>{
    const n=g.length, xs=g.map(c=>c.km||0), ys=g.map(c=>c.precio);
    const mx=xs.reduce((a,b)=>a+b,0)/n, my=ys.reduce((a,b)=>a+b,0)/n;
    let num=0,den=0; g.forEach((c,i)=>{num+=(xs[i]-mx)*(ys[i]-my); den+=(xs[i]-mx)**2;});
    const a=den?num/den:0, b=my-a*mx;
    const res=ys.map((y,i)=>y-(a*xs[i]+b));
    const sd=Math.sqrt(res.reduce((s,r)=>s+r*r,0)/n)||1;
    g.forEach((c,i)=>{
      const ratio=res[i]/sd;
      let s=50-ratio*15 + (parseFloat(c.rating)>=4.5?3:0);
      const anyos=Math.max(1,2026-(c.anyo||2026)+1);
      const kmAno=Math.round((c.km||0)/anyos);
      const partes=[];
      if(ratio<=-1) partes.push('precio muy por debajo de la tendencia de su grupo');
      else if(ratio<-.3) partes.push('más barato que la tendencia de su grupo');
      else if(ratio>1.5) partes.push('por encima del precio típico');
      if(kmAno<14000 && (c.km||0)>5000) partes.push(`${kmAno.toLocaleString('es-ES')} km/año, uso bajo`);
      if(parseFloat(c.rating)>=4.5) partes.push(`vendedor ⭐${c.rating}`);
      const dias=(Date.now()-new Date(c.publicado||0).getTime())/864e5;
      if(dias>=0 && dias<8) partes.push('recién publicado');
      m[c.id]={pos:0, score:Math.max(2,Math.min(98,Math.round(s))),
               com:partes.join(' · ')||'en la media de su grupo'};
    });
  });
  const top = Object.entries(m).sort((x,y)=>y[1].score-x[1].score).slice(0,12)
    .map(([id])=>id);
  top.forEach((id,i)=>m[id].pos=i+1);
  return {m, ia:false};
}

/* ─── gráficos ─── */
function c1(I){
  const P = I.map(c=>c.precio).filter(p=>p>0);
  const box=document.getElementById('c1');
  if(!P.length){box.innerHTML='<p class=mini>sin coches con estos filtros</p>';return}
  const min=Math.min(...P), max=Math.max(...P), paso=Math.max(1000, Math.round((max-min)/9/500)*500);
  const b0=Math.floor(min/paso)*paso, nb=Math.ceil((max-b0)/paso)+1;
  const bins=new Array(nb).fill(0);
  P.forEach(p=>bins[Math.min(nb-1,Math.floor((p-b0)/paso))]++);
  const W=420,H=200,pad=30,bw=(W-20)/nb,mx=Math.max(...bins);
  let s=svgEl(W,H);
  bins.forEach((n,i)=>{
    const h=(H-pad-10)*(n/mx), x=10+i*bw, y=H-pad-h;
    s+=`<rect x=${x+2} y=${y} width=${bw-4} height=${h} rx=3 fill="#4cc2ff" opacity="${.55+.45*n/mx}"><title>${fmtE(b0+i*paso)} – ${fmtE(b0+(i+1)*paso)}: ${n} coches</title></rect>`;
    if(n)s+=`<text x=${x+bw/2} y=${y-4} fill=#9aa7bd font-size=10 text-anchor=middle>${n}</text>`;
  });
  s+=`<line x1=8 y1=${H-pad} x2=${W-8} y2=${H-pad} stroke=#26304d/>`;
  for(let i=0;i<nb;i+=Math.ceil(nb/6))s+=`<text x=${10+i*bw+bw/2} y=${H-pad+14} fill=#9aa7bd font-size=9 text-anchor=middle>${((b0+i*paso)/1000).toFixed(0)}k</text>`;
  box.innerHTML=s+'</svg>';
}

  const marks=(c.nuevo?'<span class=nuevo>🆕</span> ':'')+(c.rebajado?'<span class=baja>📉</span> ':'')+(c.n>1?`<span class=tag>×${c.n}</span>`:'');
  const r=RANK.m[c.id];
  const badge=(r&&r.pos)?`<span class=rkn title="puntuación ${r.score}">🏆${r.pos}</span>`:'';
  return `<tr><td class=num><b>${fmtE(c.precio)}</b></td><td class=num>${c.anyo}</td><td class=num>${fmtN(c.km)}</td>`+
    `<td class=num>${c.cv}</td><td>${badge}<a href="${c.url}">${esc(c.titulo)}</a>${extra} ${marks}<div class=mini>${trimDe(c.titulo)}${c.publicado?' · publicado '+c.publicado:''}</div></td>`+
    `<td>${esc(c.lugares)}</td><td class=mini>${esc(c.vendedor||'—')}${c.rating?' ⭐'+c.rating:''}</td><td class=mini>${c.visto}</td></tr>`;
}
function tabla(I){
  const tb=document.querySelector('#tbl tbody');
  let html='';
  if(F.vista==='lista'){
    const rows=[...I].sort((a,b)=>{const A=a[orden.k],B=b[orden.k];return(typeof A=='number'?A-B:(''+A).localeCompare(''+B))*(orden.asc?1:-1)});
    html=rows.map(filaCoche).join('');
  }else{
    const clave = F.vista==='cv' ? c=>c.cv+' CV' : c=>trimDe(c.titulo);
    const grupos={};
    I.forEach(c=>{const k=clave(c);(grupos[k]=grupos[k]||[]).push(c)});
    Object.entries(grupos)
      .sort((a,b)=>F.vista==='cv'?parseInt(a[0])-parseInt(b[0]):a[0].localeCompare(b[0]))
      .forEach(([k,g])=>{
        html+=`<tr class=sec><td colspan=8>${F.vista==='cv'?'⚡':'🚘'} ${esc(k)} · ${g.length} coches · desde ${fmtE(Math.min(...g.map(c=>c.precio)))}</td></tr>`;
        html+=[...g].sort((a,b)=>a.precio-b.precio).map(filaCoche).join('');
      });
  }
  tb.innerHTML=html||'<tr><td colspan=8 class=mini style="padding:20px">sin coches con estos filtros</td></tr>';
}

/* ─── filtros UI ─── */
function chip(txt,on,fn){const b=document.createElement('button');b.className='chip'+(on?' on':'');b.textContent=txt;b.onclick=fn;return b}
function construirFiltros(){
  const cvs=[...new Set(DATA.inventario.map(c=>c.cv))].sort((a,b)=>a-b);
  const g1=document.getElementById('fCV');
  g1.appendChild(chip('Todos',F.cv==='all',()=>{F.cv='all';refresco()}));
  cvs.forEach(v=>g1.appendChild(chip(v+' CV',F.cv===v,()=>{F.cv=v;refresco()})));
  const trims=[...new Set(DATA.inventario.map(c=>trimDe(c.titulo)))].sort((a,b)=>a.localeCompare(b));
  const g2=document.getElementById('fTrim');
  g2.appendChild(chip('Todos',F.trim==='all',()=>{F.trim='all';refresco()}));
  trims.forEach(t=>g2.appendChild(chip(t,F.trim===t,()=>{F.trim=t;refresco()})));
  const g3=document.getElementById('fVista');
  [['lista','📋 Lista'],['cv','⚡ Por CV'],['acabado','🚘 Por acabado']].forEach(([v,t])=>
    g3.appendChild(chip(t,F.vista===v,()=>{F.vista=v;refresco()})));
  const g4=document.getElementById('fReset');
  g4.appendChild(chip('✕ limpiar',false,()=>{F={cv:'all',trim:'all',vista:'lista'};refresco()}));
}
function refresco(){
  document.querySelectorAll('#fCV .chip').forEach((b,i)=>b.classList.toggle('on', i===0?F.cv==='all':F.cv===+b.textContent.replace(' CV','')));
  const trims=[...new Set(DATA.inventario.map(c=>trimDe(c.titulo)))].sort((a,b)=>a.localeCompare(b));
  document.querySelectorAll('#fTrim .chip').forEach((b,i)=>b.classList.toggle('on', i===0?F.trim==='all':F.trim===trims[i-1]));
  const vistas=['lista','cv','acabado'];
  document.querySelectorAll('#fVista .chip').forEach((b,i)=>b.classList.toggle('on',F.vista===vistas[i]));
  const I=filtrar();
  kpis(I);c1(I);c2(I);c3(I);c4(I);c5(I);c6();rankingSec(I);tabla(I);
}

/* ─── arranque ─── */
if(DATA){
  RANK = mapaRanking();
  document.getElementById('sub').innerHTML =
    `Toyota Corolla Touring Sports · <b>${DATA.config}</b> · ${DATA.inventario.length} coches · actualizado ${esc(DATA.actualizado)}`;
  construirFiltros();
  document.querySelectorAll('#tbl th[data-k]').forEach(th=>{
    th.addEventListener('click',()=>{const k=th.dataset.k;orden=orden.k===k?{k,asc:!orden.asc}:{k,asc:true};refresco()});
  });
  refresco();
  document.getElementById('foot').innerHTML =
    `Hecho con 💙 por tu scraper (GitHub Actions · 2 tiradas/día) · fuente: coches.net · ranking ${RANK.ia?'por IA ('+esc(RANK.modelo)+')':'heurístico — la IA se activa sola en cuanto esté disponible'} · multilistings agrupados (×N)`;
}else{
  document.getElementById('sub').textContent='⚠️ sin datos: este fichero se genera en cada tirada del scraper';
}
</script>
